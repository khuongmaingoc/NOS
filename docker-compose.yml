services:
  mysql:
    image: mysql:8.4
    container_name: sonbds-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sonbds
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdev}
    ports:
      - "3306:3306"
    volumes:
      - sonbds_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  sonbds_mysql_data:
