<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo tài khoản | Sơn BĐS</title><link rel="stylesheet" th:href="@{/css/site.css}"></head>
<body class="auth-page"><a class="brand" th:href="@{/}">SƠN<span>BĐS</span></a>
<main class="auth-card"><p class="eyebrow">THAM GIA CỘNG ĐỒNG</p><h1>Tạo tài khoản</h1>
    <div class="form-error" th:if="${formError}" th:text="${formError}"></div>
    <form th:action="@{/register}" th:object="${form}" method="post" class="stack-form">
        <label>Họ và tên<input type="text" th:field="*{name}" autocomplete="name" required></label>
        <small class="field-error" th:errors="*{name}"></small>
        <label>Email<input type="email" th:field="*{email}" autocomplete="email" required></label>
        <small class="field-error" th:errors="*{email}"></small>
        <label>Số điện thoại (không bắt buộc)<input type="tel" th:field="*{phone}" autocomplete="tel" maxlength="30"></label>
        <label>Mật khẩu (ít nhất 8 ký tự)<input type="password" th:field="*{password}" autocomplete="new-password" minlength="8" required></label>
        <small class="field-error" th:errors="*{password}"></small>
        <label>Bạn tham gia với vai trò
            <select th:field="*{role}"><option value="CUSTOMER">Đầu khách — mua / thuê nhà</option><option value="SELLER">Đầu chủ — bán / cho thuê</option></select>
        </label>
        <button class="button" type="submit">Tạo tài khoản</button>
    </form>
    <p class="form-footer">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</main></body></html>
